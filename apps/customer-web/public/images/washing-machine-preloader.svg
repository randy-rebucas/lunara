<svg xmlns="http://www.w3.org/2000/svg" width="220" height="260" viewBox="0 0 200 240">
  <style>
    .drum-spin, .drum-spin-back {
      transform-origin: 100px 140px;
    }
    .drum-spin {
      animation: drum-rotate 1.6s linear infinite;
    }
    .drum-spin-back {
      animation: drum-rotate 1.6s linear infinite reverse;
    }
    @keyframes drum-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .bubble1, .bubble2, .bubble3 {
      transform-box: fill-box;
      transform-origin: center;
      animation: bubble-float 1.4s ease-in-out infinite;
    }
    .bubble1 { transform-origin: 100px 182px; }
    .bubble2 { transform-origin: 118px 188px; }
    .bubble3 { transform-origin: 82px 190px; }
    .bubble2 { animation-delay: 0.25s; }
    .bubble3 { animation-delay: 0.5s; }
    @keyframes bubble-float {
      0% { transform: translate(0, 0) scale(1); opacity: 0.9; }
      25% { transform: translate(4px, -4px) scale(1.1); opacity: 0.7; }
      50% { transform: translate(0, -7px) scale(1.15); opacity: 0.4; }
      75% { transform: translate(-4px, -4px) scale(1.1); opacity: 0.7; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.9; }
    }
  </style>

  <rect x="16" y="14" width="168" height="212" rx="10" fill="none" stroke="#201e1d" stroke-width="2.5"></rect>

  <line x1="16" y1="40" x2="184" y2="40" stroke="#201e1d" stroke-width="1.5"></line>
  <circle cx="34" cy="27" r="4" fill="none" stroke="#201e1d" stroke-width="1.5"></circle>
  <rect x="52" y="23" width="10" height="8" fill="none" stroke="#0088b0" stroke-width="1.5"></rect>
  <rect x="68" y="23" width="10" height="8" fill="none" stroke="#d6006c" stroke-width="1.5"></rect>
  <line x1="140" y1="19" x2="168" y2="19" stroke="#201e1d" stroke-width="1.5"></line>
  <line x1="140" y1="27" x2="160" y2="27" stroke="#201e1d" stroke-width="1.5"></line>
  <line x1="140" y1="35" x2="168" y2="35" stroke="#201e1d" stroke-width="1.5"></line>

  <circle cx="100" cy="140" r="72" fill="none" stroke="#201e1d" stroke-width="2.5"></circle>
  <circle cx="100" cy="140" r="62" fill="#f3f2f2" stroke="#00566d" stroke-width="2"></circle>

  <clipPath id="porthole-clip">
    <circle cx="100" cy="140" r="62"></circle>
  </clipPath>

  <g clip-path="url(#porthole-clip)">
    <path d="M 38 148 A 62 62 0 0 0 162 148 L 162 202 L 38 202 Z" fill="#cdeef5" opacity="0.6"></path>

    <g class="drum-spin">
      <rect x="82" y="112" width="20" height="14" rx="4" fill="#0088b0" opacity="0.85"></rect>
      <rect x="118" y="150" width="16" height="22" rx="4" fill="#d6006c" opacity="0.85"></rect>
      <rect x="66" y="158" width="18" height="16" rx="4" fill="#201e1d" opacity="0.7"></rect>
      <circle cx="128" cy="118" r="8" fill="#d6006c" opacity="0.6"></circle>
    </g>

    <g class="drum-spin-back">
      <circle cx="100" cy="182" r="5" fill="#0088b0" class="bubble1"></circle>
      <circle cx="118" cy="188" r="3.5" fill="#d6006c" class="bubble2"></circle>
      <circle cx="82" cy="190" r="3" fill="#0088b0" class="bubble3"></circle>
    </g>
  </g>

  <circle cx="100" cy="140" r="62" fill="none" stroke="#201e1d" stroke-width="2.5"></circle>
  <circle cx="100" cy="140" r="52" fill="none" stroke="#201e1d" stroke-width="1" opacity="0.35"></circle>
</svg>